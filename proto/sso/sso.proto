syntax = "proto3";

package auth;

option go_package = "tuzov.sso.v1;ssov1";

service Auth {
  rpc Register (RegisterRequest) returns (RegisterResponse); // Регистрация новых пользователей
  rpc Login (LoginRequest) returns (LoginResponse); // Авторизация пользователей
  rpc IsAdmin (IsAdminRequest) returns (IsAdminResponse); // Является ли пользователь администратором
}

message RegisterRequest {
  string email = 1;
  string password = 2;
}

message RegisterResponse {
  int64 user_id = 1;
}

message LoginRequest {
  string email = 1;
  string password = 2;
  int32  app_id = 3; // Id с какого приложения была авторизация.
}

message LoginResponse {
  string token = 1; // Токен после авторизации
}

message IsAdminRequest {
  int64 user_id = 1;
}

message IsAdminResponse {
  bool is_admin = 1;
}